<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Box Model</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>
    <h1>Explorando el Box Model</h1>
 
    <div class="caja caja1">
        Caja 1: width 200px, sin padding ni margin
    </div>
    <div class="caja caja2">
        Caja 2: width 200px, padding 20px, margin 15px
    </div>
    <div class="caja caja3">
        Caja 3: width 200px, padding 20px,
        border 5px, margin 15px
    </div>
</body>
</html>

<!-- El ancho total de la caja 1 es de 200px porque no tiene padding ni margin
     La caja 2 tiene un ancho total de 240px porque tiene padding de 20px en ambos lados
     Y la caja 3 tiene un ancho total de 250px porque tiene padding de 20px y border de 5px en ambos lados -->
