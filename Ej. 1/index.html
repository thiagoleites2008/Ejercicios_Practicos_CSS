  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas de aplicar CSS</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        #p1{
            color: red;
            font-size: 30px;
            text-align: center;
            font-family: "creepster", cursive;

        }
    </style>
</head>
<body style="background-color: black;">

    <p style="text-align: center; color: red; font-size: 30px;">El clima es soleado. Mañana será igual de soleado</p>
    <p id="p1">Clash Royale es un juego de estrategia en tiempo real desarrollado por Supercell</p>
    <p id="p2">Los juegos pixelart son populares entre los amantes del estilo retro</p>
    <!-- El CSS externo es la forma más recomendable porque separa el HTML del CSS y eso permite reutilizar los estilos en todas las páginas del proyecto, es decir, es mucho más practico -->
</body>
</html>
